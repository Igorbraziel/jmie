# JMIE — Continuous Integration Pipeline

name: CI pipeline

# Triggers
on: 
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs
jobs:
  # Job 1: Python linting and testing
  python-lint-and-tests:
    name: "Python · Lint + Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen

      - name: Lint with ruff
        working-directory: api
        run: uv run ruff check . --output-format=github

      - name: Check formatting with ruff
        working-directory: api
        run: uv run ruff format --check . --diff

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://jmie_user:test_password@localhost:5432/jmie_test
          ENV: test
          JMIE_USE_MOCK_SCRAPER: "true"
          JMIE_S3_WRITE: "false"
          PHOENIX_ENABLED: "false"
        run: |
          uv run pytest tests/unit/ \
          --verbose \
          --tb=short \
          --strict-markers \
          --no-header \
          -q
    
    services:
      postres:
        image: postgres:15
        env:
          POSTGRES_USER: jmie_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: jmie_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U jmie_user" --health-interval 10s --health-timeout 5s --health-retries 5

  # Job 2: Frontend linting and testing
  frontend-lint-and-tests:
    name: "Frontend · Lint + Test"