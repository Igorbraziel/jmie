# JMIE — Continuous Integration Pipeline

name: CI pipeline

# Triggers
on: 
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


# Jobs
jobs:
  # Job 1: Python linting
  api-lint:
    name: "Python - Lint (ruff)"
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.head_commit.modified, 'api/') ||
      contains(github.event.head_commit.modified, 'dags/') ||
      contains(github.event.head_commit.modified, 'scraper/') ||
      contains(github.event.head_commit.modified, 'nlp/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
