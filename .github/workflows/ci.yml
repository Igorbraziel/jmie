# JMIE — Continuous Integration Pipeline

name: CI pipeline

# Triggers
on: 
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs
jobs:
  # Job 1: Python linting and testing
  python-lint-and-tests:
    name: "Python · Lint + Test"
    runs-on: ubuntu-latest

    if: |
      contains(github.event.head_commit.modified, 'api/') ||
      contains(github.event.head_commit.modified, 'dags/') ||
      contains(github.event.head_commit.modified, 'scraper/') ||
      contains(github.event.head_commit.modified, 'nlp/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen

      - name: Lint with ruff
        working-directory: api
        run: uv run ruff check . --output-format=github

      - name: Check formatting with ruff
        working-directory: api
        run: uv run ruff format --check . --diff

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://jmie_user:test_password@localhost:5432/jmie_test
          ENV: test
          JMIE_USE_MOCK_SCRAPER: "true"
          JMIE_S3_WRITE: "false"
          PHOENIX_ENABLED: "false"
        run: |
          uv run pytest tests/unit/ \
          --verbose \
          --tb=short \
          --strict-markers \
          --no-header \
          -q
    
    services:
      postres:
        image: postgres:15
        env:
          POSTGRES_USER: jmie_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: jmie_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U jmie_user" --health-interval 10s --health-timeout 5s --health-retries 5

  # Job 2: Frontend linting and testing
  frontend-lint-and-tests:
    name: "Frontend · Lint + Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    if: |
      contains(github.event.head_commit.modified, 'frontend/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --max-warnings 0

      - name: Run unit tests
        run: |
          npm run test -- \
            --run \
            --reporter=verbose
        continue-on-error: true

  ci-success:
    name: "CI · All checks passed"
    runs-on: ubuntu-latest

    if: always()

    needs:
      - python-lint-and-tests
      - frontend-lint-and-tests

    steps:
      - name: Check all jobs passed or were skipped
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"

          for result in $results; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "❌ One or more CI jobs failed or were cancelled."
              exit 1
            fi
          done
 
          echo "✅ All CI checks passed."