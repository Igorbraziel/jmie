# JMIE - Continuous Deployment Pipeline

name: CD Pipeline

on:
  push:
    branches: [main]

  workflow_dispatch: # Allows manually triggering from GitHub Actions UI

concurrency:
  group: cd$-{{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


# 1. JOB - BUILD AND PUSH
jobs:
  build-and-push:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_uri: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/jmie/api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}