# Production overrides: registry images, restart policies, real data, prod credentials
services:
  # use production environment variables from .env.prod for all services
  postgres-app:
    env_file:
      - .env.prod
    restart: always
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --max_connections=200"

  postgres-airflow:
    env_file:
      - .env.prod
    restart: always

  qdrant:
    env_file:
      - .env.prod
    restart: always

  mlflow:
    env_file:
      - .env.prod
    restart: always

  phoenix:
    env_file:
      - .env.prod
    restart: always

  airflow-scheduler:
    env_file:
      - .env.prod
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      JMIE_USE_MOCK_SCRAPER: 'false'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  airflow-webui:
    env_file:
      - .env.prod
    restart: always
    environment:
      JMIE_USE_MOCK_SCRAPER: 'false'

  fastapi-app:
    env_file:
      - .env.prod
    restart: always
    image: ${GCP_REGION:-us-central1}-docker.pkg.dev/${GCP_PROJECT_ID}/jmie/api:latest
    environment:
      FASTAPI_DEBUG: 'false'
      FASTAPI_LOG_LEVEL: INFO
      JMIE_USE_MOCK_SCRAPER: 'false'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    env_file:
      - .env.prod
    restart: always
    image: ${GCP_REGION:-us-central1}-docker.pkg.dev/${GCP_PROJECT_ID}/jmie/frontend:latest
    environment:
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
