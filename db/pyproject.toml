[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jmie-db"
version = "0.1.0"
description = "JMIE database migrations and seeds"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "structlog>=23.3.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["db"]
