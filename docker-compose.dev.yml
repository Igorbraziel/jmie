# Development overrides: source builds, hot reload, debug mode, mock data
services:
  postgres-app:
    env_file:
      - .env.dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  postgres-airflow:
    env_file:
      - .env.dev
    ports:
      - "5433:5432"

  fastapi-app:
    env_file:
      - .env.dev
    build:
      context: .
      dockerfile: api/Dockerfile
      target: development
    environment:
      FASTAPI_DEBUG: 'true'
      FASTAPI_LOG_LEVEL: DEBUG
      JMIE_USE_MOCK_SCRAPER: 'true'
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

  frontend:
    env_file:
      - .env.dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    environment:
      VITE_API_BASE_URL: 'http://localhost:8000'
      NODE_ENV: development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "3000:3000"

  airflow-scheduler:
    env_file:
      - .env.dev
    environment:
      AIRFLOW_HOME: /home/airflow/airflow-home
      AIRFLOW__CORE__DAGS_FOLDER: /home/airflow/gitsync/dags
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /home/airflow/logs
      AIRFLOW__SCHEDULER__CHILD_PROCESS_LOG_DIRECTORY: /home/airflow/logs/scheduler
      JMIE_USE_MOCK_SCRAPER: 'true'
    volumes:
      - ./dags:/home/airflow/gitsync/dags
      - ./scraper:/home/airflow/gitsync/scraper
      - ./nlp:/home/airflow/gitsync/nlp
      - ./logs/airflow:/home/airflow/logs
    depends_on:
      postgres-airflow:
        condition: service_healthy
    networks:
      - jmie_network

  airflow-webui:
    env_file:
      - .env.dev
    environment:
      AIRFLOW_HOME: /home/airflow/airflow-home
      AIRFLOW__CORE__DAGS_FOLDER: /home/airflow/gitsync/dags
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /home/airflow/logs
    volumes:
      - ./dags:/home/airflow/gitsync/dags
      - ./scraper:/home/airflow/gitsync/scraper
      - ./nlp:/home/airflow/gitsync/nlp
      - ./logs/airflow:/home/airflow/logs
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-scheduler:
        condition: service_healthy
    networks:
      - jmie_network
